name: Build Fanoos Desk Windows Client

permissions:
  contents: read

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/flutter-build.yml'
      - '.github/workflows/bridge.yml'
      - '.github/workflows/third-party-RustDeskTempTopMostWindow.yml'
      - '.github/workflows/fanoos.yml'
      - 'build/redesign.py'
      - 'build/bootstrap.py'
      - 'build/fanoos.patch'
      - 'build/identity.patch'
      - "build/fonts/**"
      - "build/desktop-ui.patch"
      - "build/fanoos.png"
      - "build/fanoos.ico"
      - "build/defaults.py"
      - "build/server-defaults.json"
      - 'build/windows-installer.nsi'
      - 'build/windows-install.patch'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/flutter-build.yml'
      - '.github/workflows/bridge.yml'
      - '.github/workflows/third-party-RustDeskTempTopMostWindow.yml'
      - '.github/workflows/fanoos.yml'
      - 'build/redesign.py'
      - 'build/bootstrap.py'
      - 'build/fanoos.patch'
      - 'build/identity.patch'
      - "build/fonts/**"
      - "build/desktop-ui.patch"
      - "build/fanoos.png"
      - "build/fanoos.ico"
      - "build/defaults.py"
      - "build/server-defaults.json"
      - 'build/windows-installer.nsi'
      - 'build/windows-install.patch'
  workflow_dispatch: {}

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: fanoos-build

  package-windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: build/windows-bundle

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Build Fanoos installer
        shell: pwsh
        working-directory: build
        run: |
          Rename-Item windows-bundle/rustdesk.exe fanoosdesk.exe -ErrorAction Stop
          $metadata = Get-Content windows-bundle/fanoos-version.rs -Raw
          if ($metadata -notmatch 'BUILD_DATE: &str = "(\d{4}-\d{2}-\d{2} \d{2}:\d{2})"') { throw "Missing compiled BuildDate" }
          $date = $Matches[1]
          if ($metadata -notmatch 'VERSION: &str = "([0-9.]+)"') { throw "Missing compiled version" }
          $version = $Matches[1]
          Remove-Item windows-bundle/fanoos-version.rs
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 "/DBUILD_DATE=$date" "/DENGINE_VERSION=$version" "/DFANOOS_BUILD=$env:GITHUB_RUN_NUMBER" windows-installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS compilation failed" }
          if (-not (Test-Path "FanoosDesk-Setup-x64.exe")) {
            throw "NSIS output not found"
          }
          Move-Item "FanoosDesk-Setup-x64.exe" "FanoosDesk-Client-Windows-x64.exe" -Force

      - name: Verify fresh install and reinstall on Windows x64
        shell: pwsh
        timeout-minutes: 10
        working-directory: build
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:ProgramFiles 'FanoosDesk'
          $exe = Join-Path $path 'fanoosdesk.exe'
          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FanoosDesk'
          foreach ($pass in 1..2) {
            if ($pass -eq 2) {
              # Build 3 registered InstallLocation but omitted the engine build date.
              Remove-ItemProperty $key BuildDate
            }
            $install = Start-Process '.\FanoosDesk-Client-Windows-x64.exe' -ArgumentList '/S' -PassThru -Wait
            if ($install.ExitCode -ne 0) { throw "Install pass $pass failed: $($install.ExitCode)" }
            $entry = Get-ItemProperty $key
            if ($entry.InstallLocation -ne $path) { throw "Wrong installation path" }
            $date = (& $exe --build-date | Out-String).Trim()
            if (!$date -or $date -ne $entry.BuildDate) { throw "Installed BuildDate differs from executable: '$date' vs '$($entry.BuildDate)'" }
            if (!(Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\FanoosDesk\FanoosDesk.lnk")) { throw "Missing Start menu shortcut" }
            $svc = Get-Service -Name FanoosDesk
            $svc.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          }

      - uses: actions/upload-artifact@v4
        with:
          name: FanoosDesk-Client-Windows-x64
          path: build/FanoosDesk-Client-Windows-x64.exe
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FanoosDesk-Client-Windows-x64
          path: dist

      - name: Publish Windows client
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum FanoosDesk-Client-Windows-x64.exe > FanoosDesk-Client-Windows-x64.exe.sha256
          tag="client-windows-build-${BUILD_NUMBER}"

          cat > release-notes.md <<'EOF'
          Fanoos Desk Windows Client

          - Persian-first UI with real RTL layout
          - visible server status and server setup on the main page
          - ID Server / Relay Server / API Server / Key configuration
          - server addresses stay LTR inside the Persian UI
          - responsive Fanoos Desk desktop dashboard

          Unsigned Windows build. Validate on a Windows device before production deployment.
          EOF

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag"               --target "$BUILD_SHA"               --title "Fanoos Desk Client — Windows x64 build ${BUILD_NUMBER}"               --notes-file release-notes.md               --prerelease
          fi

          gh release upload "$tag"             FanoosDesk-Client-Windows-x64.exe             FanoosDesk-Client-Windows-x64.exe.sha256             --clobber
